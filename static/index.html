<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Inkwell</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath d='M16 3c5 6 9 11 9 16a9 9 0 0 1-18 0c0-5 4-10 9-16z' fill='%23e0a84f'/%3E%3C/svg%3E">
<link rel="stylesheet" href="app.css">
</head>
<body>
<div id="app">
  <!-- ribbon -->
  <nav id="ribbon">
    <button class="rb" data-cmd="toggle-left" title="Toggle sidebar (Ctrl+\)">☰</button>
    <button class="rb" data-cmd="new-note" title="New note (Alt+N)">✚</button>
    <button class="rb" data-cmd="daily" title="Today's daily note (Alt+D)">◷</button>
    <button class="rb" data-cmd="switcher" title="Quick switcher (Ctrl+O)">⌕</button>
    <button class="rb" data-cmd="graph" title="Graph view (Ctrl+G)">✳</button>
    <button class="rb" data-cmd="palette" title="Command palette (Ctrl+P)">⌘</button>
    <div class="rb-spacer"></div>
    <button class="rb" data-cmd="theme" title="Toggle light/dark">◐</button>
    <button class="rb" data-cmd="toggle-right" title="Toggle right panel">⫴</button>
  </nav>

  <!-- left sidebar -->
  <aside id="left">
    <div class="side-tabs">
      <button class="st active" data-tab="files">Files</button>
      <button class="st" data-tab="search">Search</button>
      <button class="st" data-tab="tags">Tags</button>
    </div>
    <section class="pane" id="pane-files">
      <div class="pane-tools">
        <button data-cmd="new-note" title="New note">＋ Note</button>
        <button data-cmd="new-folder" title="New folder">＋ Folder</button>
        <button data-cmd="collapse-all" title="Collapse all">⇱</button>
        <select id="sort" title="Sort">
          <option value="name">A→Z</option>
          <option value="mtime">Modified</option>
          <option value="ctime">Created</option>
        </select>
      </div>
      <div id="tree" tabindex="0"></div>
      <div id="vault-path" class="muted small"></div>
    </section>
    <section class="pane" id="pane-search" hidden>
      <input id="search-input" type="search" placeholder="Search notes…  (tag:foo, path:bar)" autocomplete="off">
      <div id="search-results"></div>
    </section>
    <section class="pane" id="pane-tags" hidden>
      <div id="tag-list"></div>
    </section>
  </aside>
  <div class="resizer" data-side="left"></div>

  <!-- main -->
  <main id="main">
    <header id="note-head">
      <button class="nav" id="btn-back" title="Back (Alt+←)">‹</button>
      <button class="nav" id="btn-fwd" title="Forward (Alt+→)">›</button>
      <div id="crumbs" class="muted"></div>
      <div class="head-spacer"></div>
      <span id="save-state" class="muted small"></span>
      <div class="seg" id="mode-seg">
        <button data-mode="edit" title="Edit (Ctrl+E)">Edit</button>
        <button data-mode="split" title="Split (Ctrl+Shift+E)">Split</button>
        <button data-mode="preview" title="Read (Ctrl+E)">Read</button>
      </div>
    </header>
    <div id="doc" class="mode-split">
      <div id="empty-state">
        <div class="drop">✒</div>
        <h2>No note open</h2>
        <p><kbd>Ctrl</kbd>+<kbd>O</kbd> to open a note · <kbd>Alt</kbd>+<kbd>N</kbd> to create one · <kbd>Ctrl</kbd>+<kbd>P</kbd> for commands</p>
      </div>
      <div id="edit-wrap">
        <input id="title" spellcheck="false" autocomplete="off">
        <textarea id="editor" spellcheck="true" placeholder="Start writing…  [[ to link, # to tag"></textarea>
      </div>
      <div id="preview-wrap">
        <article id="preview" class="md"></article>
      </div>
    </div>
    <footer id="status">
      <span id="st-words"></span>
      <span id="st-links"></span>
      <span class="grow"></span>
      <span id="st-vault" class="muted"></span>
    </footer>
  </main>
  <div class="resizer" data-side="right"></div>

  <!-- right sidebar -->
  <aside id="right">
    <details open><summary>Backlinks <span id="bl-count" class="badge"></span></summary><div id="backlinks"></div></details>
    <details><summary>Unlinked mentions <span id="um-count" class="badge"></span></summary><div id="unlinked"></div></details>
    <details open><summary>Outgoing links</summary><div id="outgoing"></div></details>
    <details open><summary>Tags</summary><div id="note-tags"></div></details>
    <details open><summary>Outline</summary><div id="outline"></div></details>
    <details><summary>Local graph</summary><canvas id="local-graph" height="240"></canvas></details>
  </aside>
</div>

<!-- overlays -->
<div id="palette" class="overlay" hidden>
  <div class="palette-box">
    <input id="palette-input" autocomplete="off" spellcheck="false">
    <div id="palette-list"></div>
    <div class="palette-hint muted small">↑↓ navigate · Enter open · Shift+Enter create · Esc close</div>
  </div>
</div>

<div id="graph" class="overlay" hidden>
  <div class="graph-box">
    <div class="graph-bar">
      <strong>Graph</strong>
      <label><input type="checkbox" id="g-orphans" checked> Orphans</label>
      <label><input type="checkbox" id="g-tags"> Tags</label>
      <label><input type="checkbox" id="g-unresolved"> Unresolved</label>
      <input id="g-filter" placeholder="Filter…" autocomplete="off">
      <span class="grow"></span>
      <span class="muted small">scroll to zoom · drag to pan · click to open</span>
      <button id="g-close" title="Close (Esc)">✕</button>
    </div>
    <canvas id="graph-canvas"></canvas>
  </div>
</div>

<div id="prompt" class="overlay" hidden>
  <form class="prompt-box">
    <label id="prompt-label"></label>
    <input id="prompt-input" autocomplete="off" spellcheck="false">
    <div class="prompt-btns">
      <button type="button" id="prompt-cancel">Cancel</button>
      <button type="submit" class="primary" id="prompt-ok">OK</button>
    </div>
  </form>
</div>

<div id="ctx" hidden></div>
<div id="ac" hidden></div>
<div id="hover" hidden></div>
<div id="toasts"></div>

<script src="vendor/marked.min.js"></script>
<script src="vendor/purify.min.js"></script>
<script src="app.js"></script>
</body>
</html>
